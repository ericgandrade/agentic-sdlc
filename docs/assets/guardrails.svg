<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Two panels: an evidence chain from acceptance criterion to human sign-off, and the loop limits, budgets and authority limits that bound the agents"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d3fbf"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="16" fill="#edf0f7" stroke="none" stroke-width="1"/><text x="40" y="52" font-size="28" fill="#141a2a" font-weight="700" text-anchor="start">Why you can trust the output</text><rect x="30" y="76" width="560" height="456" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="610" y="76" width="560" height="456" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="56" y="112" font-size="20" fill="#141a2a" font-weight="700" text-anchor="start">Evidence, not claims</text><text x="636" y="112" font-size="20" fill="#141a2a" font-weight="700" text-anchor="start">Bounded autonomy</text><rect x="56" y="132" width="508" height="50" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="76" y="154" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">AC-1 in the approved spec</text><text x="76" y="173" font-size="13" fill="#5b6476" font-weight="400" text-anchor="start">a numbered, testable criterion</text><line x1="310" y1="182" x2="310" y2="195" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="56" y="196" width="508" height="50" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="76" y="218" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Test named AC-1, red first</text><text x="76" y="237" font-size="13" fill="#5b6476" font-weight="400" text-anchor="start">the failing output is recorded</text><line x1="310" y1="246" x2="310" y2="259" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="56" y="260" width="508" height="50" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="76" y="282" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Command and exit code</text><text x="76" y="301" font-size="13" fill="#5b6476" font-weight="400" text-anchor="start">re-run fresh, never copied</text><line x1="310" y1="310" x2="310" y2="323" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="56" y="324" width="508" height="50" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="76" y="346" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Fingerprint of the tested tree</text><text x="76" y="365" font-size="13" fill="#5b6476" font-weight="400" text-anchor="start">any later edit makes it stale</text><line x1="310" y1="374" x2="310" y2="387" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="56" y="388" width="508" height="50" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="76" y="410" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Independent reviewer</text><text x="76" y="429" font-size="13" fill="#5b6476" font-weight="400" text-anchor="start">fresh context, default verdict NO-GO</text><line x1="310" y1="438" x2="310" y2="451" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="56" y="452" width="508" height="50" rx="8" fill="#dfe5ff" stroke="none" stroke-width="1"/><text x="76" y="474" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Human sign-off</text><text x="76" y="493" font-size="13" fill="#5b6476" font-weight="400" text-anchor="start">an explicit answer, bound to the version</text><text x="636" y="146" font-size="13" fill="#5b6476" font-weight="700" text-anchor="start">Loop</text><text x="820" y="146" font-size="13" fill="#5b6476" font-weight="700" text-anchor="start">Limit</text><text x="976" y="146" font-size="13" fill="#5b6476" font-weight="700" text-anchor="start">Then</text><rect x="636" y="158" width="508" height="38" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="652" y="182" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Red-green</text><text x="820" y="182" font-size="15" fill="#1d3fbf" font-weight="700" text-anchor="start">3 tries</text><line x1="940" y1="177" x2="964" y2="177" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><text x="976" y="182" font-size="15" fill="#141a2a" font-weight="400" text-anchor="start">structured debugging</text><rect x="636" y="204" width="508" height="38" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="652" y="228" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Debugging</text><text x="820" y="228" font-size="15" fill="#1d3fbf" font-weight="700" text-anchor="start">3 hypotheses</text><line x1="940" y1="223" x2="964" y2="223" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><text x="976" y="228" font-size="15" fill="#141a2a" font-weight="400" text-anchor="start">Architect</text><rect x="636" y="250" width="508" height="38" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="652" y="274" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Build-test</text><text x="820" y="274" font-size="15" fill="#1d3fbf" font-weight="700" text-anchor="start">5 rounds</text><line x1="940" y1="269" x2="964" y2="269" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><text x="976" y="274" font-size="15" fill="#141a2a" font-weight="400" text-anchor="start">Tech Lead</text><rect x="636" y="296" width="508" height="38" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="652" y="320" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Review-fix</text><text x="820" y="320" font-size="15" fill="#1d3fbf" font-weight="700" text-anchor="start">3 rounds</text><line x1="940" y1="315" x2="964" y2="315" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><text x="976" y="320" font-size="15" fill="#141a2a" font-weight="400" text-anchor="start">Tech Lead</text><rect x="636" y="342" width="508" height="38" rx="8" fill="#f5f7fb" stroke="none" stroke-width="1"/><text x="652" y="366" font-size="15" fill="#141a2a" font-weight="700" text-anchor="start">Same failure twice</text><text x="820" y="366" font-size="15" fill="#1d3fbf" font-weight="700" text-anchor="start">anti-thrash</text><line x1="940" y1="361" x2="964" y2="361" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><text x="976" y="366" font-size="15" fill="#141a2a" font-weight="400" text-anchor="start">Architect</text><rect x="636" y="400" width="508" height="52" rx="8" fill="#fff4dd" stroke="#c98a1e" stroke-width="1.5"/><text x="652" y="422" font-size="14" fill="#9a5b00" font-weight="700" text-anchor="start">Budgets per unattended run</text><text x="652" y="442" font-size="14" fill="#141a2a" font-weight="400" text-anchor="start">15 tasks · 4 active hours · 300 turns, then it stops</text><rect x="636" y="462" width="508" height="52" rx="8" fill="#fff4dd" stroke="#c98a1e" stroke-width="1.5"/><text x="652" y="484" font-size="14" fill="#9a5b00" font-weight="700" text-anchor="start">Authority limits</text><text x="652" y="504" font-size="14" fill="#141a2a" font-weight="400" text-anchor="start">never pushes, merges, deploys or tags without a human</text></svg>
