<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="How the Agentic SDLC was built: research, a frozen scoring method, a failed first round at 53.2, gap closure, a second round at 88.5 in first place, and an end-to-end trial"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d3fbf"/></marker></defs><rect x="0" y="0" width="1200" height="330" rx="16" fill="#edf0f7" stroke="none" stroke-width="1"/><text x="40" y="52" font-size="28" fill="#141a2a" font-weight="700" text-anchor="start">How we built it</text><text x="1160" y="52" font-size="16" fill="#1d3fbf" font-weight="700" text-anchor="end">Nov 18–25, 2026</text><rect x="50" y="92" width="170" height="196" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="76" cy="120" r="13" fill="#1d3fbf"/><text x="76" y="125" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="98" y="125" font-size="16" fill="#141a2a" font-weight="700" text-anchor="start">Research</text><text x="135.0" y="184" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">9 methods studied</text><text x="135.0" y="206" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">400+ mechanisms</text><line x1="222" y1="190.0" x2="234" y2="190.0" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="236" y="92" width="170" height="196" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="262" cy="120" r="13" fill="#1d3fbf"/><text x="262" y="125" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="284" y="125" font-size="16" fill="#141a2a" font-weight="700" text-anchor="start">Freeze the rules</text><text x="321.0" y="184" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">16 criteria, 5 profiles</text><text x="321.0" y="206" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">hashed before scoring</text><line x1="408" y1="190.0" x2="420" y2="190.0" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="422" y="92" width="170" height="196" rx="10" fill="#fff4dd" stroke="#c98a1e" stroke-width="2"/><circle cx="448" cy="120" r="13" fill="#1d3fbf"/><text x="448" y="125" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="470" y="125" font-size="16" fill="#141a2a" font-weight="700" text-anchor="start">Round 1</text><text x="507.0" y="198" font-size="46" fill="#9a5b00" font-weight="800" text-anchor="middle">53.2</text><text x="507.0" y="232" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">6th of 10</text><text x="507.0" y="254" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">failed the test</text><line x1="594" y1="190.0" x2="606" y2="190.0" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="608" y="92" width="170" height="196" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="634" cy="120" r="13" fill="#1d3fbf"/><text x="634" y="125" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="656" y="125" font-size="16" fill="#141a2a" font-weight="700" text-anchor="start">Close the gaps</text><text x="693.0" y="184" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">stage skills and</text><text x="693.0" y="206" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">tested scripts</text><line x1="780" y1="190.0" x2="792" y2="190.0" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="794" y="92" width="170" height="196" rx="10" fill="#dfe5ff" stroke="#1d3fbf" stroke-width="2"/><circle cx="820" cy="120" r="13" fill="#1d3fbf"/><text x="820" y="125" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="842" y="125" font-size="16" fill="#141a2a" font-weight="700" text-anchor="start">Round 2</text><text x="879.0" y="198" font-size="46" fill="#1d3fbf" font-weight="800" text-anchor="middle">88.5</text><text x="879.0" y="232" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">1st of 10</text><text x="879.0" y="254" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">under all 5 profiles</text><line x1="966" y1="190.0" x2="978" y2="190.0" stroke="#1d3fbf" stroke-width="2" marker-end="url(#a)"/><rect x="980" y="92" width="170" height="196" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="1006" cy="120" r="13" fill="#1d3fbf"/><text x="1006" y="125" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="1028" y="125" font-size="16" fill="#141a2a" font-weight="700" text-anchor="start">Real trial</text><text x="1065.0" y="184" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">1 Critical, 14 Important</text><text x="1065.0" y="206" font-size="14" fill="#5b6476" font-weight="400" text-anchor="middle">all fixed, re-tested</text><text x="40" y="316" font-size="14" fill="#5b6476" font-weight="400" text-anchor="start">The failed first round showed exactly what was missing; the second measured whether it was built.</text></svg>
